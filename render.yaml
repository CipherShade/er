services:
  - type: web
    name: educational-center-erp
    runtime: node
    buildCommand: npm ci --include=dev && npm run build:production
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      # Same-origin single service: set CORS_ORIGIN to the public app URL
      # (e.g. https://educational-center-erp.onrender.com). For split hosting,
      # set it to the frontend origin and add VITE_API_BASE_URL/VITE_SOCKET_URL
      # to the build step instead.
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DEFAULT_LOCALE
        value: ar
      # Optional hardening (see .env.example for all supported variables):
      # REQUEST_BODY_LIMIT_KB, SOCKET_MAX_PAYLOAD_KB, RATE_LIMIT_*
      # Only when intentionally seeding production data:
      # SEED_ADMIN_PASSWORD, SEED_RECEPTIONIST_PASSWORD