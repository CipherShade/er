name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

# This workflow is intentionally MANUAL (workflow_dispatch). Secrets referenced
# below (RENDER_SERVICE_ID, RENDER_API_KEY or the Docker registry) must be added
# as Actions secrets. Adjust the deploy step to match your hosting provider.

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Prisma validate & generate
        run: npx prisma validate && npm run db:generate

      - name: Build production
        run: npm run build:production

      # ------------------------------------------------------------------
      # Render blue-green deploy: build + start on Render, Render runs
      # `prisma migrate deploy` on startup (start:production).
      #
      # Required GitHub secrets:
      #   RENDER_SERVICE_ID  - the Render service id of the blue/green service
      #   RENDER_API_KEY     - Render API key
      #
      # Public docs: https://api-docs.render.com
      # ------------------------------------------------------------------
      - name: Trigger Render deploy
        if: ${{ github.event.inputs.environment == 'production' }}
        env:
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
