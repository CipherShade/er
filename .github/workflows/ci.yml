name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, validate & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: test
      JWT_SECRET: "ci-test-jwt-secret-string-at-least-32-chars-long"
      COOKIE_SECRET: "ci-test-cookie-secret-string-at-least-32-chars"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (with dev deps)
        run: npm ci --include=dev

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npm run db:generate

      - name: Schema push (prisma db push)
        run: npm run db:push

      - name: Build production (client + server)
        run: npm run build:production

      - name: Backend tests (DB-less)
        run: npm test

      - name: Frontend tests
        run: npm run test:frontend

      - name: DB-backed integration tests
        run: npm run test:db

  # Build the production Docker image so container regressions surface in CI.
  docker-build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: edu-center-erp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max