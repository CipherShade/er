<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="clean">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CenterOS — نظام إدارة السنتر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
/* ============================================================
   THEME VARIABLES
   ============================================================ */
:root,[data-theme="clean"]{
  --bg:#f6f5f2;--bg-subtle:#eeede9;
  --surface:#ffffff;--surface-hover:#fafaf8;
  --border:#e2e0dc;--border-strong:#d0cdc8;
  --text:#20242a;--text-secondary:#6b7280;--text-muted:#9ca3af;
  --primary:#0e7c56;--primary-hover:#0b6a4a;--primary-soft:#e8f5ef;--primary-text:#ffffff;
  --accent:#b45309;--accent-soft:#fef3cd;
  --danger:#c8362c;--danger-soft:#fde8e8;
  --success:#0e7c56;--success-soft:#e8f5ef;
  --warning:#d97706;--warning-soft:#fef3cd;
  --shadow-xs:0 1px 2px rgba(16,24,40,.04);
  --shadow-sm:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 8px -2px rgba(16,24,40,.06),0 2px 4px -2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 16px -4px rgba(16,24,40,.08),0 4px 6px -2px rgba(16,24,40,.03);
  --radius:10px;--radius-sm:6px;--radius-lg:14px;--radius-pill:999px;
  --sidebar-w:260px;--sidebar-collapsed:72px;--header-h:64px;
  --font-body:'Cairo','Inter',system-ui,sans-serif;
  --transition:150ms cubic-bezier(.4,0,.2,1);
}
[data-theme="pos"]{
  --bg:#f0ede8;--bg-subtle:#e6e2db;
  --surface:#ffffff;--surface-hover:#f7f5f1;
  --border:#d5d0c8;--border-strong:#bbb5a8;
  --text:#141414;--text-secondary:#555;--text-muted:#888;
  --primary:#0a6e44;--primary-hover:#085c38;--primary-soft:#d8f0e0;--primary-text:#fff;
  --accent:#a34600;--accent-soft:#fde8c8;
  --danger:#b22d24;--danger-soft:#fcdcdc;
  --success:#0a6e44;--success-soft:#d8f0e0;
  --warning:#b45309;--warning-soft:#fde8c8;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow-md:0 4px 8px rgba(0,0,0,.1);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --radius:6px;--radius-sm:4px;--radius-lg:10px;--radius-pill:999px;
  --sidebar-w:240px;--sidebar-collapsed:68px;--header-h:60px;
}
[data-theme="dark"]{
  --bg:#0c1210;--bg-subtle:#131c18;
  --surface:#182420;--surface-hover:#1e2e28;
  --border:#263630;--border-strong:#354840;
  --text:#e4e8e6;--text-secondary:#90a8a0;--text-muted:#607068;
  --primary:#22c584;--primary-hover:#18a86e;--primary-soft:rgba(34,197,132,.12);--primary-text:#0c1210;
  --accent:#f59e0b;--accent-soft:rgba(245,158,11,.12);
  --danger:#ef4444;--danger-soft:rgba(239,68,68,.12);
  --success:#22c584;--success-soft:rgba(34,197,132,.12);
  --warning:#f59e0b;--warning-soft:rgba(245,158,11,.12);
  --shadow-xs:0 1px 2px rgba(0,0,0,.2);
  --shadow-sm:0 1px 3px rgba(0,0,0,.3);
  --shadow-md:0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  --radius:10px;--radius-sm:6px;--radius-lg:14px;--radius-pill:999px;
  --sidebar-w:260px;--sidebar-collapsed:72px;--header-h:64px;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;scroll-behavior:smooth;}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;transition:background var(--transition),color var(--transition);}
a{color:var(--primary);text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;background:var(--surface);color:var(--text);transition:border-color var(--transition),box-shadow var(--transition);width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
table{width:100%;border-collapse:collapse;}
th{text-align:start;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);padding:10px 12px;border-bottom:1px solid var(--border);}
td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
tr:hover td{background:var(--surface-hover);}
img,svg{display:block;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px;}

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
.app-layout{display:flex;min-height:100vh;direction:inherit;}
.sidebar{position:fixed;top:0;bottom:0;inset-inline-start:0;width:var(--sidebar-w);background:var(--surface);border-inline-start:1px solid var(--border);z-index:40;display:flex;flex-direction:column;transition:width var(--transition),transform var(--transition);overflow:hidden;}
.sidebar.collapsed{width:var(--sidebar-collapsed);}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 18px;height:var(--header-h);border-bottom:1px solid var(--border);flex-shrink:0;}
.sidebar-logo .logo-mark{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--primary);display:flex;align-items:center;justify-content:center;color:var(--primary-text);font-weight:800;font-size:14px;flex-shrink:0;}
.sidebar-logo .logo-text{font-weight:700;font-size:16px;white-space:nowrap;transition:opacity var(--transition);}
.sidebar.collapsed .logo-text,.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-group-title{opacity:0;width:0;overflow:hidden;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px;}
.nav-group{margin-bottom:16px;}
.nav-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:4px 10px 6px;white-space:nowrap;transition:opacity var(--transition);}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-secondary);font-weight:500;font-size:13px;cursor:pointer;transition:all var(--transition);white-space:nowrap;position:relative;}
.nav-item:hover{background:var(--bg);color:var(--text);}
.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:600;}
.nav-item svg{width:20px;height:20px;flex-shrink:0;}
.nav-label{transition:opacity var(--transition);}
.sidebar.collapsed .nav-item{justify-content:center;padding:10px;}
.sidebar.collapsed .nav-item[title]:hover::after{content:attr(title);position:absolute;inset-inline-end:calc(100% + 8px);top:50%;transform:translateY(-50%);background:var(--text);color:var(--bg);padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;white-space:nowrap;z-index:100;pointer-events:none;}

/* Header */
.app-main{flex:1;margin-inline-start:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;transition:margin-inline-start var(--transition);}
.sidebar.collapsed ~ .app-main{margin-inline-start:var(--sidebar-collapsed);}
.app-header{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:30;flex-shrink:0;}
.header-right{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
.header-left{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.breadcrumb{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.breadcrumb span{color:var(--text);font-weight:600;}
.search-trigger{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text-muted);font-size:13px;cursor:pointer;transition:all var(--transition);min-width:220px;}
.search-trigger:hover{border-color:var(--border-strong);background:var(--surface-hover);}
.search-trigger kbd{font-size:11px;padding:1px 5px;border:1px solid var(--border);border-radius:4px;font-family:inherit;color:var(--text-muted);margin-inline-start:auto;}
.header-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-secondary);transition:all var(--transition);position:relative;}
.header-btn:hover{background:var(--bg);color:var(--text);}
.header-btn .badge{position:absolute;top:4px;inset-inline-end:4px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--surface);}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;cursor:pointer;}
.lang-btn{font-size:12px;font-weight:600;padding:4px 8px;border-radius:var(--radius-sm);color:var(--text-secondary);transition:all var(--transition);}
.lang-btn:hover{background:var(--bg);color:var(--text);}
.user-menu-wrap{position:relative;display:flex;}
.user-menu{position:absolute;top:42px;inset-inline-end:0;min-width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:70;animation:fadeIn .15s ease;}
.user-menu.open{display:block;}
.user-menu-head{padding:10px 12px;border-bottom:1px solid var(--border);margin-bottom:6px;}
.user-menu-name{font-weight:700;font-size:13px;}
.user-menu-role{font-size:12px;margin-top:6px;}
.user-menu-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:var(--radius-sm);font-size:13px;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);}
.user-menu-item:hover{background:var(--bg);color:var(--danger);}
.user-menu-item svg{width:16px;height:16px;}

/* Role badge */
.role-badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;background:var(--bg);color:var(--text-secondary);border:1px solid var(--border);}
.role-badge.admin{background:var(--primary-soft);color:var(--primary);border-color:transparent;}

/* Login / role selection overlay */
.login-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;}
.login-overlay.show{display:flex;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:32px 28px;text-align:center;}
.login-logo{width:56px;height:56px;margin-inline:auto;border-radius:var(--radius);background:var(--primary);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:var(--shadow-md);}
.login-title{font-size:18px;font-weight:800;margin-top:16px;}
.login-sub{color:var(--text-muted);font-size:13px;margin:6px 0 20px;}
.login-demo{font-size:11px;color:var(--text-muted);margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:6px;}
.login-demo svg{width:14px;height:14px;}
.login-account{display:flex;align-items:center;gap:14px;text-align:start;width:100%;padding:14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);cursor:pointer;transition:all var(--transition);margin-bottom:10px;}
.login-account:hover{border-color:var(--primary);background:var(--primary-soft);}
.login-account .acc-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--primary-text);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;}
.login-account .acc-name{font-weight:700;font-size:14px;}
.login-account .acc-sub{font-size:12px;color:var(--text-muted);margin-top:1px;}
.login-account .acc-tag{margin-inline-start:auto;font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--radius-pill);background:var(--primary-soft);color:var(--primary);flex-shrink:0;}
.login-account .acc-arrow{color:var(--text-muted);flex-shrink:0;display:flex;}

/* Sessions timeline */
.sess-summary{display:flex;gap:10px;margin-bottom:20px;}
.sess-sum-item{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-xs);}
.sess-sum-item strong{font-size:22px;font-weight:800;color:var(--primary);}
.sess-sum-item span{font-size:13px;color:var(--text-secondary);}
.tl-sec{margin-bottom:24px;}
.tl-sec-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.tl-count{font-size:11px;font-weight:600;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-pill);padding:2px 8px;}
.tl-item{display:grid;grid-template-columns:auto 22px 1fr auto;gap:12px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow-xs);transition:border-color var(--transition),transform var(--transition);}
.tl-item:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.tl-time{text-align:center;min-width:54px;}
.tl-start{font-weight:800;font-size:15px;color:var(--text);}
.tl-end{font-size:11px;color:var(--text-muted);}
.tl-rail{align-self:stretch;position:relative;display:flex;justify-content:center;align-items:flex-start;}
.tl-rail::before{content:'';position:absolute;top:6px;bottom:6px;width:2px;background:var(--border);}
.tl-dot{position:relative;z-index:1;margin-top:22px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 4px var(--surface);}
.tl-item.phase-now .tl-dot{border:3px solid var(--primary);}
.tl-item.phase-next .tl-dot{border:3px solid var(--accent);}
.tl-item.phase-done .tl-dot{border:3px solid var(--text-muted);}
.tl-main{min-width:0;}
.tl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.tl-head strong{font-size:15px;font-weight:700;}
.tl-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:2px;}
.tl-meta svg{width:13px;height:13px;}
.tl-meta .tl-num{font-weight:700;color:var(--text-secondary);}
.tl-action{display:flex;}
.pill-muted{background:var(--bg);color:var(--text-muted);border:1px solid var(--border);}
@media(max-width:680px){
  .sess-summary{flex-direction:column;}
  .tl-item{grid-template-columns:auto 1fr;gap:8px;padding:12px;}
  .tl-rail{display:none;}
  .tl-time{text-align:start;min-width:0;display:flex;align-items:baseline;gap:6px;}
  .tl-start{font-size:13px;}
  .tl-action{grid-column:1 / -1;}
  .tl-action .btn{width:100%;justify-content:center;}
}

/* Main Content */
.screen-content{flex:1;padding:24px;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:22px;font-weight:700;}
.page-subtitle{font-size:13px;color:var(--text-secondary);margin-top:2px;}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;transition:all var(--transition);white-space:nowrap;}
.btn-primary{background:var(--primary);color:var(--primary-text);box-shadow:var(--shadow-xs);}
.btn-primary:hover{background:var(--primary-hover);box-shadow:var(--shadow-sm);}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--surface-hover);border-color:var(--border-strong);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{opacity:.9;}
.btn-ghost{color:var(--text-secondary);}
.btn-ghost:hover{background:var(--bg);color:var(--text);}
.btn-sm{padding:5px 10px;font-size:12px;}
.btn-lg{padding:12px 24px;font-size:15px;}
.btn svg{width:16px;height:16px;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs);transition:box-shadow var(--transition),background var(--transition);}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:14px;font-weight:700;}
.card-body{padding:16px;}

/* Status Pill */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;}
.pill-success{background:var(--success-soft);color:var(--success);}
.pill-warning{background:var(--warning-soft);color:var(--warning);}
.pill-danger{background:var(--danger-soft);color:var(--danger);}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}

/* Grids */
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

/* Metrics */
.metric{padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-xs);}
.metric-label{font-size:12px;color:var(--text-muted);font-weight:500;margin-bottom:4px;}
.metric-value{font-size:20px;font-weight:700;line-height:1.2;}
.metric-sub{font-size:11px;color:var(--text-secondary);margin-top:2px;}

/* Progress Bar */
.progress{height:6px;background:var(--bg-subtle);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;background:var(--primary);transition:width .4s ease;}
.progress-fill.warning{background:var(--warning);}
.progress-fill.danger{background:var(--danger);}

/* Session Pill */
.session-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all var(--transition);white-space:nowrap;}
.session-pill:hover{border-color:var(--border-strong);background:var(--surface-hover);}
.session-pill.active{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
.session-pill .time{font-size:11px;color:var(--text-muted);font-weight:500;}

/* Empty state */
.empty-state{text-align:center;padding:48px 24px;color:var(--text-muted);}
.empty-state svg{width:48px;height:48px;margin:0 auto 12px;opacity:.4;}

/* Sidebar toggle (hamburger) */
.menu-toggle{display:none;}

/* Mobile Backdrop */
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;opacity:0;transition:opacity var(--transition);}
.backdrop.show{display:block;opacity:1;}

/* ============================================================
   DASHBOARD SPECIFICS
   ============================================================ */
.greeting{margin-bottom:24px;}
.greeting h1{font-size:24px;font-weight:800;}
.greeting p{color:var(--text-secondary);font-size:14px;margin-top:4px;}
.metrics-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px;}
.session-card{padding:16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-xs);cursor:pointer;transition:all var(--transition);position:relative;overflow:hidden;}
.session-card::before{content:'';position:absolute;top:0;inset-inline-end:0;width:4px;height:100%;border-radius:0 4px 4px 0;}
.session-card[data-status="active"]::before{background:var(--primary);}
.session-card[data-status="upcoming"]::before{background:var(--accent);}
.session-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px);}
.session-card-top{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;}
.session-card h3{font-size:15px;font-weight:700;}
.session-card .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--text-secondary);margin-bottom:10px;}
.session-card .meta span{display:flex;align-items:center;gap:4px;}
.session-card .headcount-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px;}
.session-card .headcount-nums{font-size:13px;font-weight:600;}
.session-card .headcount-sub{font-size:11px;color:var(--text-muted);}

.attention-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
.attention-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow-xs);transition:box-shadow var(--transition);}
.attention-item:hover{box-shadow:var(--shadow-sm);}
.attention-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.attention-icon.warn{background:var(--warning-soft);color:var(--warning);}
.attention-icon.danger{background:var(--danger-soft);color:var(--danger);}
.attention-icon.info{background:var(--primary-soft);color:var(--primary);}
.attention-text{flex:1;min-width:0;}
.attention-text strong{font-size:13px;display:block;}
.attention-text span{font-size:12px;color:var(--text-secondary);}

/* ============================================================
   LOBBY SPECIFICS
   ============================================================ */
.lobby-status-bar{display:flex;align-items:center;gap:12px;padding:12px 0;margin-bottom:16px;flex-wrap:wrap;}
.lobby-status-bar .desk-info{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;}
.lobby-status-bar .shift-status{margin-inline-start:auto;}
.session-bar{display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin-bottom:20px;scrollbar-width:none;}
.session-bar::-webkit-scrollbar{display:none;}
.lobby-search-area{margin-bottom:20px;position:relative;}
.lobby-search-area input{font-size:16px;padding:14px 16px;border:2px solid var(--border);border-radius:var(--radius);text-align:start;}
.lobby-search-area input:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);}
.search-results{position:absolute;top:calc(100% + 4px);inset-inline-start:0;inset-inline-end:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:10;max-height:320px;overflow-y:auto;display:none;}
.search-results.show{display:block;}
.search-result-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background var(--transition);border-bottom:1px solid var(--border);}
.search-result-item:last-child{border-bottom:none;}
.search-result-item:hover{background:var(--bg);}
.search-result-item .avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.search-result-item .info{flex:1;}
.search-result-item .name{font-weight:600;font-size:14px;}
.search-result-item .detail{font-size:12px;color:var(--text-secondary);}

.checkin-panel{display:none;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);padding:20px;margin-top:16px;box-shadow:var(--shadow-sm);animation:slideUp .2s ease;}
.checkin-panel.show{display:block;}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.checkin-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.checkin-header .avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
.checkin-info{flex:1;}
.checkin-info h3{font-size:16px;font-weight:700;}
.checkin-info p{font-size:13px;color:var(--text-secondary);}
.checkin-session-info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;font-size:13px;}
.checkin-session-info div{padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm);}
.checkin-session-info .label{color:var(--text-muted);font-size:11px;display:block;margin-bottom:2px;}
.payment-options{display:flex;gap:8px;margin:16px 0;}
.payment-opt{flex:1;padding:12px;border:2px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;transition:all var(--transition);font-weight:600;font-size:13px;}
.payment-opt:hover{border-color:var(--border-strong);background:var(--surface-hover);}
.payment-opt.selected{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
.payment-opt .pay-icon{font-size:20px;display:block;margin-bottom:4px;}

/* Success overlay */
.success-overlay{position:fixed;inset:0;background:rgba(255,255,255,.95);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;animation:fadeIn .2s ease;}
.success-overlay.show{display:flex;}
.success-overlay .check-circle{width:64px;height:64px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;animation:scaleIn .3s ease;}
.success-overlay .check-circle svg{width:32px;height:32px;}
@keyframes scaleIn{from{transform:scale(.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.success-overlay h2{font-size:18px;font-weight:700;color:var(--success);}
.success-overlay p{font-size:14px;color:var(--text-secondary);}

/* Live headcount */
.headcount-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;}
.headcount-bar .label{font-size:13px;font-weight:600;}
.headcount-bar .progress{flex:1;}
.headcount-bar .nums{font-size:14px;font-weight:700;white-space:nowrap;}
.headcount-bar .avail{font-size:12px;color:var(--text-muted);}

/* ============================================================
   STUDENTS TABLE / CARDS
   ============================================================ */
.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.filter-row input{max-width:300px;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-xs);}
.table-wrap table{min-width:700px;}
.table-wrap td .name-cell{font-weight:600;}
.table-wrap td .sub-cell{font-size:11px;color:var(--text-muted);}

/* Student profile */
.profile-header{display:flex;gap:20px;align-items:center;padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);margin-bottom:20px;box-shadow:var(--shadow-xs);}
.profile-avatar{width:64px;height:64px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;flex-shrink:0;}
.profile-info h2{font-size:20px;font-weight:700;}
.profile-info .sub{color:var(--text-secondary);font-size:14px;}
.profile-info .contact{display:flex;gap:16px;margin-top:8px;font-size:13px;color:var(--text-secondary);}
.profile-stats{display:flex;gap:16px;margin-bottom:20px;}
.profile-stat{flex:1;padding:16px;text-align:center;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
.profile-stat .num{font-size:24px;font-weight:800;}
.profile-stat .label{font-size:12px;color:var(--text-muted);margin-top:2px;}
.profile-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0;}
.profile-tab{padding:10px 16px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all var(--transition);}
.profile-tab:hover{color:var(--text);}
.profile-tab.active{color:var(--primary);border-bottom-color:var(--primary);}

/* ============================================================
   SESSIONS / CALENDAR
   ============================================================ */
.sessions-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.tab-bar{display:flex;gap:2px;background:var(--bg);border-radius:var(--radius-sm);padding:2px;}
.tab-btn{padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;transition:all var(--transition);}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow-xs);}
.sessions-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}

/* ============================================================
   TEACHERS / ROOMS
   ============================================================ */
.teacher-card{display:flex;gap:14px;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-xs);transition:box-shadow var(--transition);cursor:pointer;}
.teacher-card:hover{box-shadow:var(--shadow-sm);}
.teacher-avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
.teacher-info{flex:1;}
.teacher-info h3{font-size:14px;font-weight:700;}
.teacher-info .sub{font-size:12px;color:var(--text-secondary);}
.teacher-info .fee{font-size:12px;color:var(--primary);font-weight:600;margin-top:4px;}

.room-card{padding:20px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-xs);transition:box-shadow var(--transition);cursor:pointer;}
.room-card:hover{box-shadow:var(--shadow-sm);}
.room-card h3{font-size:16px;font-weight:700;margin-bottom:8px;}
.room-card .cap-info{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
.room-card .cap-info .pct{font-weight:700;color:var(--primary);}

/* ============================================================
   SHIFT REGISTER
   ============================================================ */
.shift-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.shift-section{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
.shift-section h3{font-size:14px;font-weight:700;margin-bottom:12px;}
.shift-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.shift-row:last-child{border-bottom:none;}
.shift-row .val{font-weight:700;}
.shift-total{display:flex;justify-content:space-between;padding:12px 16px;background:var(--primary-soft);border-radius:var(--radius);margin-top:16px;font-weight:700;font-size:15px;}

/* Shift close modal steps */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:modalIn .2s ease;}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px);}to{opacity:1;transform:none;}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-header h3{font-size:16px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all var(--transition);}
.modal-close:hover{background:var(--bg);color:var(--text);}
.modal-body{padding:20px;}
.modal-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}

.step-indicator{display:flex;gap:4px;margin-bottom:20px;}
.step-dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background var(--transition);}
.step-dot.done{background:var(--primary);}
.step-dot.current{background:var(--accent);}

.step-content{min-height:120px;}
.step-content .big-num{font-size:32px;font-weight:800;text-align:center;margin:16px 0;}
.step-content .big-num.green{color:var(--success);}
.step-content .big-num.red{color:var(--danger);}
.step-content label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
.step-content input[type="number"]{font-size:24px;font-weight:700;text-align:center;padding:12px;}

/* ============================================================
   RECONCILIATION
   ============================================================ */
.reconcile-card{max-width:500px;margin:0 auto;text-align:center;}
.reconcile-counts{display:flex;align-items:center;justify-content:center;gap:24px;margin:24px 0;}
.reconcile-count{text-align:center;}
.reconcile-count .num{font-size:36px;font-weight:800;}
.reconcile-count .label{font-size:13px;color:var(--text-secondary);margin-top:4px;}
.reconcile-diff{font-size:18px;font-weight:700;padding:12px 20px;border-radius:var(--radius);margin:16px 0;}
.reconcile-diff.mismatch{background:var(--danger-soft);color:var(--danger);}
.reconcile-diff.match{background:var(--success-soft);color:var(--success);}

/* ============================================================
   SETTLEMENT
   ============================================================ */
.settlement-calc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0;}
.settlement-calc .calc-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px;}
.settlement-calc .calc-row .val{font-weight:700;}
.settlement-calc .calc-total{display:flex;justify-content:space-between;padding:12px 0;font-size:16px;font-weight:700;color:var(--primary);}

/* ============================================================
   REPORTS
   ============================================================ */
.chart-card{padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);}
.chart-card h3{font-size:14px;font-weight:700;margin-bottom:12px;}
.chart-bar{display:flex;align-items:end;gap:8px;height:140px;padding-top:8px;}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.chart-col .bar{width:100%;border-radius:3px 3px 0 0;background:var(--primary);transition:height .4s ease;min-height:2px;}
.chart-col .bar-label{font-size:10px;color:var(--text-muted);text-align:center;}
.chart-col .bar-val{font-size:11px;font-weight:600;}
.donut-wrap{display:flex;align-items:center;gap:20px;}
.donut-legend{display:flex;flex-direction:column;gap:6px;}
.donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.donut-legend-item .swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0;}

/* ============================================================
   USERS TABLE
   ============================================================ */
.role-badge{padding:2px 8px;border-radius:var(--radius-pill);font-size:11px;font-weight:600;background:var(--primary-soft);color:var(--primary);}
.role-badge.admin{background:var(--accent-soft);color:var(--accent);}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
.palette-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-start;justify-content:center;padding-top:20vh;}
.palette-overlay.show{display:flex;}
.palette{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:520px;animation:modalIn .15s ease;}
.palette input{border:none;border-bottom:1px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px;width:100%;background:transparent;}
.palette input:focus{box-shadow:none;}
.palette-results{max-height:320px;overflow-y:auto;padding:8px;}
.palette-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;transition:background var(--transition);}
.palette-item:hover,.palette-item.focused{background:var(--primary-soft);color:var(--primary);}
.palette-item svg{width:18px;height:18px;opacity:.5;}
.palette-item .shortcut{margin-inline-start:auto;font-size:11px;color:var(--text-muted);font-family:monospace;}

/* ============================================================
   STYLE SWITCHER FLOATING
   ============================================================ */
.style-float{position:fixed;bottom:16px;inset-inline-end:16px;z-index:80;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:4px;display:flex;gap:2px;}
.style-opt{padding:5px 10px;border-radius:var(--radius-sm);font-size:11px;font-weight:600;cursor:pointer;transition:all var(--transition);color:var(--text-secondary);white-space:nowrap;}
.style-opt:hover{color:var(--text);background:var(--bg);}
.style-opt.active{background:var(--primary);color:var(--primary-text);}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container{position:fixed;top:16px;inset-inline-end:16px;z-index:300;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-md);font-size:13px;font-weight:500;animation:toastIn .2s ease;display:flex;align-items:center;gap:8px;max-width:360px;}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:none;}}
.toast.success{border-color:var(--success);color:var(--success);}
.toast.error{border-color:var(--danger);color:var(--danger);}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:1200px){
  .metrics-row{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:1024px){
  .sidebar{transform:translateX(100%);}
  html[dir="ltr"] .sidebar{transform:translateX(-100%);}
  .sidebar{inset-inline-start:0;}
  .sidebar.open{transform:translateX(0);}
  .app-main{margin-inline-start:0 !important;}
  .sidebar.collapsed ~ .app-main{margin-inline-start:0 !important;}
  .menu-toggle{display:flex;}
  .sidebar-logo{padding:16px;}
  .shift-grid{grid-template-columns:1fr;}
}
@media(max-width:768px){
  .screen-content{padding:16px;}
  .page-header{flex-direction:column;align-items:flex-start;}
  .page-title{font-size:18px;}
  .metrics-row{grid-template-columns:1fr 1fr;}
  .live-grid{grid-template-columns:1fr;}
  .reconcile-counts{gap:12px;}
  .reconcile-count .num{font-size:28px;}
  .settlement-calc{grid-template-columns:1fr;}
  .profile-header{flex-direction:column;text-align:center;}
  .profile-avatar{width:56px;height:56px;font-size:20px;}
  .profile-stats{flex-wrap:wrap;}
  .profile-stat{min-width:calc(50% - 8px);}
  .payment-options{flex-direction:column;}
  .search-trigger{min-width:0;flex:1;}
  .search-trigger span{display:none;}
  .style-float{bottom:8px;inset-inline-end:8px;}
  .grid-3,.grid-4{grid-template-columns:1fr;}
  .sessions-grid{grid-template-columns:1fr;}
}
@media(max-width:480px){
  .metrics-row{grid-template-columns:1fr;}
  .metric-value{font-size:18px;}
  .donut-wrap{flex-direction:column;}
  .profile-tabs{overflow-x:auto;}
}

/* ============================================================
   MISC
   ============================================================ */
.text-start{text-align:start;}
.text-end{text-align:end;}
.text-center{text-align:center;}
.text-muted{color:var(--text-muted);}
.text-primary{color:var(--primary);}
.text-danger{color:var(--danger);}
.text-success{color:var(--success);}
.text-warning{color:var(--warning);}
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;}
.mb-8{margin-bottom:8px;} .mb-12{margin-bottom:12px;} .mb-16{margin-bottom:16px;} .mb-24{margin-bottom:24px;}
.flex{display:flex;} .flex-col{flex-direction:column;} .items-center{align-items:center;} .justify-between{justify-content:space-between;} .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.w-full{width:100%;}
.hidden{display:none !important;}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
</style>
</head>
<body>
<div class="app-layout" id="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- Mobile backdrop -->
  <div class="backdrop" id="backdrop" onclick="App.closeSidebar()"></div>

  <!-- Main -->
  <div class="app-main" id="app-main">
    <header class="app-header" id="app-header"></header>
    <div class="screen-content" id="screen-content"></div>
  </div>
</div>

<!-- Login / role selection -->
<div class="login-overlay" id="login-overlay"></div>

<!-- Command palette -->
<div class="palette-overlay" id="palette-overlay" onclick="if(event.target===this)App.closePalette()">
  <div class="palette">
    <input type="text" id="palette-input" placeholder="بحث..." oninput="App.filterPalette(this.value)">
    <div class="palette-results" id="palette-results"></div>
  </div>
</div>

<!-- Shift close modal -->
<div class="modal-overlay" id="shift-modal" onclick="if(event.target===this)App.closeModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="shift-modal-title"></h3>
      <button class="modal-close" onclick="App.closeModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="shift-modal-body"></div>
    <div class="modal-footer" id="shift-modal-footer"></div>
  </div>
</div>

<!-- Reconcile modal -->
<div class="modal-overlay" id="reconcile-modal" onclick="if(event.target===this)App.closeReconcileModal()">
  <div class="modal">
    <div class="modal-header">
      <h3 id="reconcile-modal-title"></h3>
      <button class="modal-close" onclick="App.closeReconcileModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="reconcile-modal-body"></div>
    <div class="modal-footer" id="reconcile-modal-footer"></div>
  </div>
</div>

<!-- Success overlay -->
<div class="success-overlay" id="success-overlay">
  <div class="check-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
  <h2 id="success-title">تم التسجيل</h2>
  <p id="success-detail"></p>
</div>

<!-- Toast -->
<div class="toast-container" id="toast-container"></div>

<!-- Style float -->
<div class="style-float" id="style-float"></div>

<script>
/* ================================================================
   ICONS (inline SVG)

const S={
  screen:'dashboard',
  lang: localStorage.getItem('cos_lang')||'ar',
  theme: localStorage.getItem('cos_theme')||'clean',

const fmtEGP = n => new Intl.NumberFormat('en-US').format(n)+' ج.م';
const fmtEGPEn = n => 'EGP '+new Intl.NumberFormat('en-US').format(n);

function t(key){return (LANG[S.lang]||LANG.ar)[key]||key;}
function fegp(n){return S.lang==='en'?fmtEGPEn(n):fmtEGP(n);}
function tField(o){return S.lang==='en'?o.nameEn||o.name||o.subjectEn||o.subject:o.name||o.subject;}
function tName(o){return S.lang==='en'?o.nameEn||o.name:o.name;}
function tGrade(o){return S.lang==='en'?o.gradeEn||o.grade:o.grade;}
function tSubject(o){return S.lang==='en'?o.subjectEn||o.subject:o.subject;}
function tRoom(o){return S.lang==='en'?o.nameEn||o.name:o.name;}
function tLast(o){return S.lang==='en'?o.lastEn||o.last:o.last;}
function tRole(o){return S.lang==='en'?o.roleEn||o.role:o.role;}
function tStatus(o){return (S.lang==='en'?(o.status==='active'?'Active':'Inactive'):(o.status==='active'?'نشط':'معطل'));}

/* ================================================================

   ================================================================ */
function icon(name,size=20){return `<span style="display:inline-flex;width:${size}px;height:${size}px;">${I[name]||''}</span>`;}

/* ================================================================

const App={

  renderSidebar(){
    const nav=[

        {id:'rooms',icon:'rooms',label:t('nav_rooms')},

        {id:'settle',icon:'settle',label:t('nav_settle')},

  renderScreen(){
    const el=document.getElementById('screen-content');

      case 'dashboard': App.renderDashboard(el); break;
      case 'lobby': App.renderLobby(el); break;

      case 'students': App.renderStudents(el); break;
      case 'teachers': App.renderTeachers(el); break;
      case 'rooms': App.renderRooms(el); break;
      case 'shift': App.renderShift(el); break;
      case 'reconcile': App.renderReconcile(el); break;
      case 'settle': App.renderSettle(el); break;
      case 'reports': App.renderReports(el); break;
      case 'users': App.renderUsers(el); break;
      default: el.innerHTML='<div class="empty-state"><h2>Coming soon</h2></div>';

    const seatsLeft=capSum-checkedSum;

      <div class="metric"><div class="metric-label">${t('students_today')}</div><div class="metric-value">284</div><div class="metric-sub">+8% ${S.lang==='en'?'vs yesterday':'من أمس'}</div></div>
      <div class="metric"><div class="metric-label">${t('sessions_today')}</div><div class="metric-value">18</div><div class="metric-sub">${activeSessions.length} ${S.lang==='en'?'active now':'نشطة الآن'}</div></div>

      <div class="metric"><div class="metric-label">${t('seats_left')}</div><div class="metric-value">${seatsLeft}</div><div class="metric-sub">${S.lang==='en'?'across live sessions':'بين الحصص الجارية'}</div></div>`
    :`
      <div class="metric"><div class="metric-label">${t('revenue')}</div><div class="metric-value">${fegp(12450)}</div><div class="metric-sub">+12% ${S.lang==='en'?'vs yesterday':'من أمس'}</div></div>
      <div class="metric"><div class="metric-label">${t('students_today')}</div><div class="metric-value">284</div><div class="metric-sub">+8% ${S.lang==='en'?'vs yesterday':'من أمس'}</div></div>
      <div class="metric"><div class="metric-label">${t('sessions_today')}</div><div class="metric-value">18</div><div class="metric-sub">${activeSessions.length} ${S.lang==='en'?'active now':'نشطة الآن'}</div></div>
      <div class="metric"><div class="metric-label">${t('teacher_due')}</div><div class="metric-value">${fegp(7200)}</div><div class="metric-sub">4 ${S.lang==='en'?'pending':'بانتظار التصفية'}</div></div>`;
    const att1Action=isRec
      ?`<button class="btn btn-sm btn-secondary" onclick="App.go('lobby')">${t('view_lobby')}</button>`
      :`<button class="btn btn-sm btn-secondary" onclick="App.go('reconcile')">${t('att1_action')}</button>`;
    el.innerHTML=`
    <div class="greeting">
      <h1>${t('good_morning')}، ${greetingName}</h1>
      <p>${t('greeting_sub')}</p>
    </div>
    <div class="metrics-row">${metrics}</div>
    <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">${t('live_ops')}</h2>
    <div class="live-grid">
      ${SESSIONS.map(s=>{
        const teacher=TEACHERS.find(t=>t.id===s.teacherId);
        const room=ROOMS.find(r=>r.id===s.roomId);
        const pct=Math.round(s.checked/s.capacity*100);
        return `<div class="session-card" data-status="${s.status}" onclick="App.go('lobby')">
          <div class="session-card-top">
            <h3>${tSubject(s)}</h3>
            <span class="pill ${s.status==='active'?'pill-success':'pill-warning'}"><span class="dot"></span>${s.status==='active'?t('active'):t('upcoming')}</span>
          </div>
          <div class="meta">
            <span>${icon('teachers',14)} ${tName(teacher)}</span>
            <span>${icon('rooms',14)} ${tRoom(room)}</span>
            <span>${icon('clock',14)} ${s.start} — ${s.end}</span>
          </div>
          <div class="headcount-row">
            <div><span class="headcount-nums">${s.checked} / ${s.capacity}</span><div class="progress" style="width:120px;margin-top:6px;"><div class="progress-fill ${pct>90?'warning':''}" style="width:${pct}%"></div></div></div>
            <button class="btn btn-sm btn-secondary" onclick="event.stopPropagation();App.go('lobby')">${t('view_lobby')}</button>
          </div>
        </div>`;
      }).join('')}

    <h2 style="font-size:16px;font-weight:700;margin-bottom:12px;">${t('attention')}</h2>
    <div class="attention-list">
      <div class="attention-item">
        <div class="attention-icon warn">${icon('alert',20)}</div>
        <div class="attention-text"><strong>${t('att1_title')}</strong><span>${t('att1_sub')}</span></div>
        ${att1Action}

        <div class="attention-icon danger">${icon('shift',20)}</div>
        <div class="attention-text"><strong>${t('att2_title')}</strong></div>
        <button class="btn btn-sm btn-secondary" onclick="App.go('shift')">${t('att2_action')}</button>

        <div class="attention-icon info">${icon('clock',20)}</div>
        <div class="attention-text"><strong>${t('att3_title')}</strong></div>
        <button class="btn btn-sm btn-secondary" onclick="App.go('sessions')">${t('att3_action')}</button>
      </div>
    </div>`;

  /* ----- Lobby ----- */
  renderLobby(el){
    const session=SESSIONS.find(s=>s.id===S.activeSession);
    const teacher=TEACHERS.find(t=>t.id===session.teacherId);
    const room=ROOMS.find(r=>r.id===session.roomId);
    const pct=Math.round(session.checked/session.capacity*100);
    const avail=session.capacity-session.checked;

    el.innerHTML=`
    <div class="page-header"><div><h1 class="page-title">${t('lobby_title')}</h1></div></div>
    <div class="lobby-status-bar">
      <div class="desk-info">${icon('user',16)} <strong>${t('desk')}</strong> — ${t('operator')}</div>
      <span class="pill pill-success shift-status"><span class="dot"></span>${t('shift_open')}</span>
    </div>

      ${SESSIONS.map(s=>{
        const tch=TEACHERS.find(x=>x.id===s.teacherId);

  selectSession(id){
    S.activeSession=id;
    App.renderScreen();
  },

  searchStudent(query){
    const results=document.getElementById('search-results');
    if(!query||query.length<1){results.classList.remove('show');return;}
    const nq=query.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
    const matches=STUDENTS.filter(s=>{
      const nm=s.name.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').toLowerCase();
      return nm.includes(nq)||s.phone.includes(query)||s.id===parseInt(query);
    });
    if(matches.length===0){results.innerHTML=`<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px;">${S.lang==='en'?'No results found':'لا توجد نتائج'}</div>`;results.classList.add('show');return;}
    results.innerHTML=matches.map(s=>`
      <div class="search-result-item" onclick="App.selectStudent(${s.id})">
        <div class="avatar">${s.name.charAt(0)}</div>
        <div class="info"><div class="name">${tName(s)}</div><div class="detail">${s.phone} · ${tGrade(s)}</div></div>
      </div>
    `).join('');
    results.classList.add('show');
  },

  selectStudent(id){
    S.selectedStudent=STUDENTS.find(s=>s.id===id);
    S.selectedPayment=null;
    const session=SESSIONS.find(s=>s.id===S.activeSession);
    const teacher=TEACHERS.find(t=>t.id===session.teacherId);
    const room=ROOMS.find(r=>r.id===session.roomId);
    const panel=document.getElementById('checkin-panel');
    document.getElementById('search-results').classList.remove('show');
    panel.innerHTML=`
      <div class="checkin-header">
        <div class="avatar">${S.selectedStudent.name.charAt(0)}</div>
        <div class="checkin-info">
          <h3>${tName(S.selectedStudent)}</h3>
          <p>${S.selectedStudent.phone} · ${tGrade(S.selectedStudent)}</p>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('checkin-panel').classList.remove('show')">${icon('x',16)}</button>
      </div>
      <div class="checkin-session-info">
        <div><span class="label">${t('subject_label')}</span>${tSubject(session)}</div>
        <div><span class="label">${t('teacher_label')}</span>${tName(teacher)}</div>
        <div><span class="label">${t('room_label')}</span>${tRoom(room)}</div>
        <div><span class="label">${t('price_label')}</span><strong style="color:var(--primary);font-size:15px;">${fegp(session.price)}</strong></div>
      </div>
      <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text-secondary);">${S.lang==='en'?'Payment Method':'طريقة الدفع'}</div>
      <div class="payment-options">
        <div class="payment-opt" onclick="App.selectPayment('cash')"><span class="pay-icon">💵</span>${t('pay_cash')}<br><kbd style="font-size:10px;color:var(--text-muted);">1</kbd></div>
        <div class="payment-opt" onclick="App.selectPayment('vodafone')"><span class="pay-icon">📱</span>${t('pay_vodafone')}<br><kbd style="font-size:10px;color:var(--text-muted);">2</kbd></div>
        <div class="payment-opt" onclick="App.selectPayment('instapay')"><span class="pay-icon">⚡</span>${t('pay_instapay')}<br><kbd style="font-size:10px;color:var(--text-muted);">3</kbd></div>
      </div>
      <button class="btn btn-primary btn-lg w-full mt-12" id="checkin-btn" onclick="App.confirmCheckin()" style="justify-content:center;">${t('check_in')}</button>`;
    panel.classList.add('show');
  },

  selectPayment(type){
    S.selectedPayment=type;
    document.querySelectorAll('.payment-opt').forEach((el,i)=>{
      el.classList.toggle('selected',['cash','vodafone','instapay'][i]===type);
    });
  },

  confirmCheckin(){
    if(!S.selectedPayment){App.toast(S.lang==='en'?'Select payment method':'اختر طريقة الدفع','error');return;}
    const session=SESSIONS.find(s=>s.id===S.activeSession);
    session.checked++;
    const names={cash:t('pay_cash'),vodafone:t('pay_vodafone'),instapay:t('pay_instapay')};
    document.getElementById('success-title').textContent=t('success_checkin');
    document.getElementById('success-detail').textContent=`${tName(S.selectedStudent)} · ${fegp(session.price)} · ${names[S.selectedPayment]}`;
    document.getElementById('success-overlay').classList.add('show');
    setTimeout(()=>{
      document.getElementById('success-overlay').classList.remove('show');
      S.selectedStudent=null;S.selectedPayment=null;
      App.renderScreen();
    },1200);
  },

  /* ----- Sessions ----- */
  renderSessions(el){

      ?new Date().toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long'})
      :new Date().toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
    const now=SESSIONS.filter(s=>s.status==='active');
    const next=SESSIONS.filter(s=>s.status==='upcoming');
    const done=COMPLETED;
    const canManage=App.canAccess('users');
    const row=s=>{
      const isDone=s.status==='completed';
      const teacher=TEACHERS.find(x=>x.id===s.teacherId);
      const room=ROOMS.find(r=>r.id===s.roomId);
      const pct=Math.round(s.checked/s.capacity*100);
      const phase=isDone?'done':(s.status==='upcoming'?'next':'now');
      const pill=isDone?'pill-muted':(s.status==='active'?'pill-success':'pill-warning');
      const btn=isDone?'':(s.status==='upcoming'
        ?`<button class="btn btn-sm btn-secondary" onclick="App.openSessionFromList(${s.id})">${icon('clock',14)} ${t('sess_open')}</button>`
        :`<button class="btn btn-sm btn-primary" onclick="App.openSessionFromList(${s.id})">${icon('lobby',14)} ${t('sess_checkin')}</button>`);
      return `<div class="tl-item phase-${phase}">
        <div class="tl-time"><div class="tl-start">${s.start}</div><div class="tl-end">${s.end}</div></div>
        <div class="tl-rail"><span class="tl-dot"></span></div>
        <div class="tl-main">
          <div class="tl-head"><strong>${tSubject(s)}</strong><span class="pill ${pill}"><span class="dot"></span>${isDone?t('sess_completed'):(s.status==='active'?t('active'):t('upcoming'))}</span></div>
          <div class="tl-meta">${icon('teachers',13)} ${tName(teacher)} · ${icon('rooms',13)} ${tRoom(room)}<span class="tl-num">${s.checked}/${s.capacity}</span></div>
          <div class="progress" style="max-width:280px;margin-top:6px;"><div class="progress-fill ${pct>90?'warning':''}" style="width:${pct}%"></div></div>
        </div>
        <div class="tl-action">${btn}</div>
      </div>`;
    };
    const section=(title,list)=>list.length?`
      <div class="tl-sec"><div class="tl-sec-title">${title}<span class="tl-count">${list.length}</span></div>
      <div class="timeline">${list.map(row).join('')}</div></div>`:'';
    el.innerHTML=`
    <div class="page-header">
      <div><h1 class="page-title">${t('sessions_title')}</h1><p class="page-subtitle">${dateStr}</p></div>
      <div class="page-actions">
        <button class="btn btn-secondary" onclick="App.toast('${S.lang==='en'?'Calendar view coming soon':'عرض التقويم قريباً'}')">${icon('sessions',16)} ${t('sess_calendar')}</button>
        ${canManage?`<button class="btn btn-primary" onclick="App.toast('${S.lang==='en'?'New session form coming soon':'نموذج حصة جديدة قريباً'}')">${icon('plus',16)} ${t('sess_new')}</button>`:''}
      </div>
    </div>
    <div class="sess-summary">
      <div class="sess-sum-item"><strong>${now.length}</strong><span>${t('active')}</span></div>
      <div class="sess-sum-item"><strong>${next.length}</strong><span>${t('upcoming')}</span></div>
      <div class="sess-sum-item"><strong>${done.length}</strong><span>${t('sess_completed')}</span></div>
    </div>
    ${section(`${t('sess_now')}`,now)}
    ${section(t('sess_next'),next)}
    ${section(t('sess_done'),done)}
    `;
  },

  openShiftModal(){
    S.shiftStep=0;
    S.shiftActual=2500;

  renderShiftStep(){
    const steps=[t('step_expected'),t('step_actual'),t('step_diff'),t('step_reason'),t('step_confirm')];
    document.getElementById('shift-modal-title').textContent=t('close_confirm');
    const body=document.getElementById('shift-modal-body');
    const footer=document.getElementById('shift-modal-footer');
    let dots=steps.map((_,i)=>`<div class="step-dot ${i<S.shiftStep?'done':''} ${i===S.shiftStep?'current':''}"></div>`).join('');
    let content='';
    if(S.shiftStep===0){
      content=`<div class="big-num green">${fegp(2550)}</div><p style="text-align:center;color:var(--text-secondary);">${t('step_expected')}</p>`;
    }else if(S.shiftStep===1){
      content=`<label>${t('step_actual')}</label><input type="number" id="shift-actual" value="${S.shiftActual}" style="font-size:24px;font-weight:700;text-align:center;padding:12px;" oninput="App.updateShiftDiff(this.value)">`;
    }else if(S.shiftStep===2){
      const diff=S.shiftActual-2550;
      const sign=diff>0?'+':diff<0?'-':'';
      content=`<div class="big-num ${diff<0?'red':'green'}">${sign}${fegp(Math.abs(diff))}</div><p style="text-align:center;color:var(--text-secondary);">${t('step_diff')}</p>`;
    }else if(S.shiftStep===3){
      content=`<label>${t('step_reason')}</label><textarea id="shift-reason" rows="3" placeholder="${S.lang==='en'?'Enter reason for difference...':'أدخل سبب الفرق...'}" style="margin-top:8px;" oninput="S.shiftReason=this.value">${S.shiftReason||''}</textarea>`;
    }else{
      content=`<div style="text-align:center;">${icon('check',48).replace('20px','48px')}<p style="font-size:15px;font-weight:600;margin-top:8px;">${S.lang==='en'?'Close the shift and lock all records?':'هل تريد إغلاق الوردية وقفل كل السجلات؟'}</p></div>`;
    }
    body.innerHTML=`<div class="step-indicator">${dots}</div><div class="step-content">${content}</div>`;
    footer.innerHTML=`
      ${S.shiftStep>0?`<button class="btn btn-secondary" onclick="App.shiftPrev()">${t('step_back')}</button>`:''}
      ${S.shiftStep<4?`<button class="btn btn-primary" onclick="App.shiftNext()">${t('step_next')}</button>`:`<button class="btn btn-danger" onclick="App.confirmShiftClose()">${t('step_confirm')}</button>`}`;
  },

  shiftNext(){S.shiftStep++;App.renderShiftStep();},
  shiftPrev(){S.shiftStep--;App.renderShiftStep();},
  updateShiftDiff(v){S.shiftActual=parseInt(v)||0;},
  confirmShiftClose(){
    document.getElementById('shift-modal').classList.remove('show');
    App.toast(S.lang==='en'?'Shift closed successfully!':'تم إغلاق الوردية بنجاح!','success');
  },

    document.getElementById('reconcile-modal-body').innerHTML=`

    else{el.innerHTML=`<span style="color:var(--danger);">⚠ ${diff>0?'+':''}${diff} ${S.lang==='en'?'difference':'فرق'}</span>`;}

    S.settled[id]=true;
    App.renderScreen();
    App.toast(S.lang==='en'?'Settlement confirmed!':'تم تأكيد التصفية!','success');
  },

  /* ----- Reports ----- */
  renderReports(el){
    const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو'];
    const monthsEn=['Jan','Feb','Mar','Apr','May','Jun'];
    const revData=[42000,38500,45200,41800,48500,52000];
    const maxRev=Math.max(...revData);
    const ml=S.lang==='en'?monthsEn:months;
    el.innerHTML=`
    <div class="page-header"><div><h1 class="page-title">${t('reports_title')}</h1></div></div>
    <div class="grid-2 mb-16">
      <div class="chart-card">
        <h3>${t('revenue_chart')}</h3>
        <div class="chart-bar">
          ${revData.map((v,i)=>`<div class="chart-col"><div class="bar-val">${Math.round(v/1000)}k</div><div class="bar" style="height:${v/maxRev*100}%"></div><div class="bar-label">${ml[i]}</div></div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <h3>${t('payment_chart')}</h3>
        <div class="donut-wrap">
          <svg viewBox="0 0 120 120" width="120" height="120" style="transform:rotate(-90deg);">
            <circle cx="60" cy="60" r="50" fill="none" stroke="var(--border)" stroke-width="12"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#0e7c56" stroke-width="12" stroke-dasharray="180 314" stroke-dashoffset="0"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#d97706" stroke-width="12" stroke-dasharray="80 314" stroke-dashoffset="-180"/>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#2563eb" stroke-width="12" stroke-dasharray="54 314" stroke-dashoffset="-260"/>
          </svg>
          <div class="donut-legend">
            <div class="donut-legend-item"><span class="swatch" style="background:#0e7c56;"></span> ${t('pay_cash')} 57%</div>
            <div class="donut-legend-item"><span class="swatch" style="background:#d97706;"></span> Vodafone Cash 25%</div>
            <div class="donut-legend-item"><span class="swatch" style="background:#2563eb;"></span> InstaPay 17%</div>
          </div>
        </div>
      </div>
    </div>
    <div class="grid-2">
      <div class="chart-card">
        <h3>${t('attendance_chart')}</h3>
        <div class="chart-bar">
          ${[85,92,78,88,95,90].map((v,i)=>`<div class="chart-col"><div class="bar-val">${v}%</div><div class="bar" style="height:${v}%;background:var(--primary);opacity:${.5+v/200}"></div><div class="bar-label">${ml[i]}</div></div>`).join('')}
        </div>
      </div>
      <div class="chart-card">
        <h3>${t('payout_chart')}</h3>
        <div class="chart-bar">
          ${[32000,29000,34000,31000,36000,39000].map((v,i)=>`<div class="chart-col"><div class="bar-val">${Math.round(v/1000)}k</div><div class="bar" style="height:${v/42000*100}%;background:var(--accent);"></div><div class="bar-label">${ml[i]}</div></div>`).join('')}
        </div>
      </div>
    </div>`;
  },

  /* ----- Users ----- */
  renderUsers(el){
    el.innerHTML=`
    <div class="page-header">
      <div><h1 class="page-title">${t('users_title')}</h1></div>
      <div class="page-actions"><button class="btn btn-primary">${icon('plus',16)} ${S.lang==='en'?'Add User':'إضافة مستخدم'}</button></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>${t('th_user_name')}</th><th>${t('th_username')}</th><th>${t('th_role')}</th><th>${t('th_user_phone')}</th><th>${t('th_user_status')}</th><th>${t('th_user_actions')}</th></tr></thead>
        <tbody>
          ${USERS.map(u=>`
            <tr>
              <td><div class="name-cell">${tName(u)}</div></td>
              <td><span style="color:var(--text-muted);">@${u.username}</span></td>
              <td><span class="role-badge ${u.role==='admin'?'admin':''}">${tRole(u)}</span></td>
              <td>${u.phone}</td>
              <td><span class="pill ${u.status==='active'?'pill-success':'pill-danger'}"><span class="dot"></span>${tStatus(u)}</span></td>
              <td>
                <div style="display:flex;gap:4px;">
                  <button class="btn btn-ghost btn-sm" onclick="App.toast('${t('edit')}')">${t('edit')}</button>
                  <button class="btn btn-ghost btn-sm" onclick="App.toast('${t('reset_pass')}')">${icon('lock',14)}</button>
                  <button class="btn btn-ghost btn-sm" style="color:var(--danger);" onclick="App.toast('${t('disable')}')">${icon('x',14)}</button>
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  },

  /* ----- Palette ----- */
  openPalette(){
    document.getElementById('palette-overlay').classList.add('show');
    const inp=document.getElementById('palette-input');
    inp.value='';inp.focus();
    App.filterPalette('');
  },
  closePalette(){document.getElementById('palette-overlay').classList.remove('show');},
  filterPalette(q){
    const items=[
      {icon:'dashboard',label:t('nav_dashboard'),screen:'dashboard'},
      {icon:'lobby',label:t('nav_lobby'),screen:'lobby'},
      {icon:'sessions',label:t('nav_sessions'),screen:'sessions'},
      {icon:'students',label:t('nav_students'),screen:'students'},
      {icon:'teachers',label:t('nav_teachers'),screen:'teachers'},
      {icon:'rooms',label:t('nav_rooms'),screen:'rooms'},
      {icon:'shift',label:t('nav_shift'),screen:'shift'},
      {icon:'reconcile',label:t('nav_reconcile'),screen:'reconcile'},
      {icon:'settle',label:t('nav_settle'),screen:'settle'},
      {icon:'reports',label:t('nav_reports'),screen:'reports'},
      {icon:'users',label:t('nav_users'),screen:'users'},
    ];
    const nq=q.toLowerCase();
    const filtered=items.filter(it=>App.canAccess(it.screen)).filter(it=>it.label.includes(q)||it.screen.includes(nq));
    document.getElementById('palette-results').innerHTML=filtered.map((it,i)=>`
      <div class="palette-item ${i===0?'focused':''}" onclick="App.go('${it.screen}');App.closePalette();">
        ${icon(it.icon,18)} <span>${it.label}</span>
      </div>
    `).join('')||`<div style="padding:16px;text-align:center;color:var(--text-muted);">${S.lang==='en'?'No results':'لا نتائج'}</div>`;
  },

  /* ----- Sidebar toggle ----- */
  toggleSidebar(){
    const sb=document.getElementById('sidebar');
    const bd=document.getElementById('backdrop');
    if(window.innerWidth<=1024){
      sb.classList.toggle('open');
      bd.classList.toggle('show');
    }else{
      S.collapsed=!S.collapsed;
      localStorage.setItem('cos_collapsed',S.collapsed?'1':'0');
      sb.classList.toggle('collapsed',S.collapsed);
    }
  },
  closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('backdrop').classList.remove('show');
  },

  /* ----- Lang toggle ----- */
  toggleLang(){
    S.lang=S.lang==='ar'?'en':'ar';
    document.documentElement.lang=S.lang;
    document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
    localStorage.setItem('cos_lang',S.lang);
    App.renderAll();
  },

  /* ----- Theme ----- */
  setTheme(theme){
    S.theme=theme;
    document.documentElement.dataset.theme=theme;
    localStorage.setItem('cos_theme',theme);
    App.renderStyleFloat();
  },

  renderStyleFloat(){
    const themes=[{id:'clean',label:'Clean SaaS'},{id:'pos',label:'Modern POS'},{id:'dark',label:'Premium Dark'}];
    document.getElementById('style-float').innerHTML=themes.map(th=>`<div class="style-opt ${S.theme===th.id?'active':''}" onclick="App.setTheme('${th.id}')">${th.label}</div>`).join('');
  },

  /* ----- Login / roles ----- */
  renderLogin(){
    const accounts=[
      {key:'admin',tag:t('role_admin'),sub:t('login_full_access')},
      {key:'receptionist',tag:t('role_reception'),sub:t('login_reception_desc')},
    ];
    document.getElementById('login-overlay').innerHTML=`
      <div class="login-card">
        <div class="login-logo">${t('logo').charAt(0)}</div>
        <div class="login-title">${t('login_title')}</div>
        <div class="login-sub">${t('login_sub')}</div>
        <div class="login-demo">${icon('alert',14)} ${t('demo_hint')}</div>
        ${accounts.map(a=>{
          const u=ROLES[a.key];
          const nm=S.lang==='en'?u.nameEn:u.name;
          return `<div class="login-account" onclick="App.login('${a.key}')">
            <div class="acc-avatar">${nm.charAt(0)}</div>
            <div>
              <div class="acc-name">${nm}</div>
              <div class="acc-sub">${a.sub}</div>
            </div>
            <span class="acc-tag">${a.tag}</span>
            <span class="acc-arrow"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
          </div>`;
        }).join('')}
      </div>`;
  },

  login(role){
    S.role=role;
    localStorage.setItem('cos_role',role);
    S.screen='dashboard';
    document.getElementById('login-overlay').classList.remove('show');
    App.renderAll();
    App.toast(S.lang==='en'?'Welcome back':'أهلاً بعودتك','success');
  },

  logout(){
    S.role=null;
    localStorage.removeItem('cos_role');
    S.screen='dashboard';
    App.renderLogin();
    document.getElementById('login-overlay').classList.add('show');
    App.renderAll();
  },

  toggleUserMenu(){
    document.getElementById('user-menu').classList.toggle('open');
  },

  /* ----- Toast ----- */
  toast(msg,type='success'){
    const c=document.getElementById('toast-container');
    const t=document.createElement('div');
    t.className=`toast ${type}`;
    t.innerHTML=`${type==='success'?icon('check',16):icon('alert',16)} ${msg}`;
    c.appendChild(t);
    setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-8px)';t.style.transition='all .2s';setTimeout(()=>t.remove(),200);},2500);
  },

  /* ----- Init ----- */
  renderAll(){
    document.documentElement.dataset.theme=S.theme;
    document.documentElement.lang=S.lang;
    document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
    App.renderSidebar();
    App.renderHeader();
    App.renderScreen();
    App.renderStyleFloat();
  },

  init(){
    App.renderAll();
    App.renderLogin();
    if(!S.role)document.getElementById('login-overlay').classList.add('show');
    document.addEventListener('click',e=>{
      const w=document.getElementById('user-menu-wrap');
      if(w&&w.contains(e.target))return;
      document.getElementById('user-menu')?.classList.remove('open');
    });
    /* Keyboard shortcuts */
    document.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();App.openPalette();}
      if(e.key==='Escape'){App.closePalette();App.closeModal();App.closeReconcileModal();}
      if(S.screen==='lobby'){
        const inp=document.getElementById('lobby-search');
        if(document.activeElement!==inp&&e.key==='/'&&!e.ctrlKey&&!e.metaKey){
          e.preventDefault();if(inp)inp.focus();
        }
        if(S.selectedPayment===null&&['1','2','3'].includes(e.key)){
          App.selectPayment(['cash','vodafone','instapay'][parseInt(e.key)-1]);
        }
      }
    });
  }
};

App.init();
</script>
</body>
</html>
